<div class="auth-wrapper">
  <!-- Header -->
  <div class="brand-header">
    <div class="logo-box">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 8h1a4 4 0 0 1 0 8h-1"></path>
        <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"></path>
        <line x1="6" y1="2" x2="6" y2="4"></line>
        <line x1="10" y1="2" x2="10" y2="4"></line>
        <line x1="14" y1="2" x2="14" y2="4"></line>
      </svg>
    </div>
    <h1 class="brand-title">ChaiKhata</h1>
    <p class="brand-subtitle">Your daily café billing companion</p>
  </div>

  <!-- Card Container -->
  <div class="auth-card">
    <!-- Tabs -->
    <div class="tab-container">
      <button type="button" class="tab-btn active">Sign In</button>
      <button type="button" class="tab-btn">Sign Up</button>
    </div>

    <!-- Form -->
    <form>
      <!-- Email Field -->
      <div class="form-group">
        <label>Email</label>
        <div class="input-wrapper">
          <span class="icon left-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
          <input type="email" placeholder="you@example.com" />
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <span class="icon left-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input type="password" placeholder="••••••••" />
          <button type="button" class="icon right-icon toggle-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <!-- Forgot Password -->
      <div class="forgot-password">
        <a href="#">Forgot password?</a>
      </div>

      <!-- Submit Button -->
      <button type="button" class="submit-btn">Sign In</button>
    </form>
  </div>
</div>
