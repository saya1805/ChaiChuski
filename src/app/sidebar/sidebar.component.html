<aside class="sidebar" [class.closed]="isClosed()">
  <!-- Header Section (Logo + Title + Toggle Button) -->
  <div class="sidebar-header">
    <div class="brand-box">
      <div class="tea-logo-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tea-icon">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <path d="M6 2v3" class="steam steam-1"></path>
          <path d="M10 1v4" class="steam steam-2"></path>
          <path d="M14 2v3" class="steam steam-3"></path>
        </svg>
      </div>
      <div class="brand-info">
        <h2 class="brand-name">ChaiKhata</h2>
        <span class="brand-sub">Café Billing</span>
      </div>
    </div>

    <!-- Toggle Button (Open/Close करण्याकरिता) -->
    <button class="toggle-btn" (click)="toggleSidebar()" type="button" title="Toggle Sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <a href="javascript:void(0)" class="nav-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>Dashboard</span>
    </a>

    <a href="javascript:void(0)" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
      <span>New Sale</span>
    </a>

    <a href="javascript:void(0)" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
        <line x1="2" y1="10" x2="22" y2="10"></line>
      </svg>
      <span>Sales History</span>
    </a>

    <a href="javascript:void(0)" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
      </svg>
      <span>Menu Items</span>
    </a>

    <a href="javascript:void(0)" class="nav-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span>Reports</span>
    </a>
  </nav>

  <!-- User Profile Section -->
  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="avatar">S</div>
      <div class="user-details">
        <span class="user-name">sayalishelke000</span>
        <span class="user-role">Café Owner</span>
      </div>
    </div>

    <button class="logout-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span>Sign Out</span>
    </button>
  </div>
</aside>
